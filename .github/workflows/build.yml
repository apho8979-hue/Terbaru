name: Build Web to Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak File ZIP
        run: unzip *.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Konversi Web ke Proyek Android (Capacitor)
        working-directory: personakit-promotion-ai
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PersonaKit AI" "com.personakit.promotionai" --web-dir=public
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: personakit-promotion-ai/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: personakit-promotion-ai/android/app/build/outputs/apk/debug/app-debug.apk
